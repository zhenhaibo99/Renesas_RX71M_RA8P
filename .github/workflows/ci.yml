name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: protocol selftest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile and run the C protocol selftest
        shell: pwsh
        run: ./ci/pipeline.ps1 -Stage protocol

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-summary
          path: ci/out/summary.txt
          if-no-files-found: ignore
